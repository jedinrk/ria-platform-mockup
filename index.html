<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Console · Models</title>
<style>
:root{--ink:#20352f;--mut:#697a74;--line:#dde5df;--green:#17644e;--bg:#f5f7f3;--amber:#95621c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:8px;padding:9px 14px;color:var(--ink)}button:hover{border-color:var(--green);background:#f0f7f2}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #73ad98;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#104d3b;color:white}.quiet{border:0;background:transparent;color:var(--green)}header{height:72px;display:flex;align-items:center;gap:35px;background:white;padding:0 5%;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:750}.brand i{font-style:normal;background:var(--green);color:white;border-radius:8px;padding:5px 9px;margin-right:9px}header .active{align-self:stretch;display:flex;align-items:center;border-bottom:3px solid var(--green);font-weight:650}.right{margin-left:auto}.avatar{border-radius:50%;background:#eaf0e9;padding:7px 10px;font-size:12px}.demo{background:#edf2e9;color:#546450;font-size:12px;padding:7px 5%;display:flex;justify-content:space-between;gap:10px}main{max-width:1180px;margin:35px auto;padding:0 25px 100px}h1{font-size:32px;letter-spacing:-1px;line-height:1.2;margin:5px 0 10px}h2{font-size:19px;margin:0 0 6px}p{margin:6px 0 16px}.muted,small{color:var(--mut)}small{font-size:12px}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:750;letter-spacing:1.8px;color:var(--green)}.flex{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:22px;margin:20px 0}.hero{display:grid;grid-template-columns:1fr 270px;gap:28px}.stat{border-left:1px solid var(--line);padding-left:25px}.stat b{font-size:30px;display:block}.badge{display:inline-block;border-radius:20px;padding:3px 9px;font-size:12px;background:#e8f2ec;color:#246442}.draft{background:#fff2d9;color:var(--amber)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th{text-align:left;color:var(--mut);font-size:12px;font-weight:600;padding:12px 15px;border-bottom:1px solid var(--line)}td{padding:17px 15px;border-bottom:1px solid #edf1ec}tr:last-child td{border:0}.name{font-weight:700;font-size:16px}.name small{display:block;font-weight:400;margin-top:3px}.link{padding:0;border:0;color:var(--green);font-weight:700;text-align:left;background:transparent}.allocation{height:12px;display:flex;gap:3px;margin:25px 0 12px;border-radius:8px;overflow:hidden;background:#edf1ec}.allocation span{min-width:0}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}.toolbar{margin:26px 0 10px}.panelgrid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:20px}.panelgrid .card{margin-top:0}.note{background:#f1f5ef;padding:14px;border-radius:9px;font-size:13px}.warning{background:#fff4df;color:#7d541a}.errors{color:#9c422a;font-size:13px}.ok{color:var(--green)}.allocationtable{min-width:650px}.allocationtable td{padding:13px 12px}.allocationtable th{padding:12px}.target{width:78px;padding:7px;border:1px solid #cfdcd3;border-radius:7px;text-align:right;background:white;color:var(--ink)}.target:disabled{border-color:transparent;background:transparent;opacity:1}.rowtop{background:#f8faf7}.child{color:#496256}.chev{border:0;background:transparent;padding:3px 9px;width:32px}.footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid var(--line);padding:16px max(25px,calc((100vw - 1130px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;backdrop-filter:blur(12px)}.footer small{display:block}.field{display:flex;flex-direction:column;gap:6px;margin:15px 0}.field input,.field textarea,.field select{padding:10px;border:1px solid #ccd8d0;border-radius:7px;background:white;color:var(--ink)}dialog{border:1px solid var(--line);border-radius:16px;width:min(760px,94vw);max-height:88vh;padding:28px;box-shadow:0 20px 100px #12382b35;color:var(--ink)}dialog::backdrop{background:#132c2566;backdrop-filter:blur(3px)}dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#183f30;color:white;border-radius:9px;padding:12px 20px;z-index:10;max-width:90vw}.crumb{font-size:13px;margin-bottom:22px}.chips{display:flex;gap:7px;flex-wrap:wrap}.history{padding:16px 0;border-bottom:1px solid var(--line)}.titleinput{font-size:25px;width:100%;border:1px solid var(--line);padding:7px;border-radius:7px}.description{width:100%;border:1px solid var(--line);padding:8px;border-radius:7px;resize:vertical}#storage{color:#a84b26} @media(max-width:800px){header{padding:0 20px;gap:20px}.hero,.panelgrid{grid-template-columns:1fr}.stat{border-left:0;padding-left:0}.panelgrid aside{display:none}main{padding:0 15px 140px;margin-top:24px}.footer{align-items:flex-start;flex-wrap:wrap;padding:12px 15px}.demo{padding:7px 15px}.avatar{display:none}h1{font-size:27px}.card{padding:16px}.right{display:none}.brand{font-size:17px}}
</style></head><body>
<header><span class="brand"><i>P</i>Portfolio Console</span><span class="active">Models</span><span class="right muted">Adviser workspace</span><span class="avatar">AR</span></header>
<div class="demo"><span>INTERACTIVE PROTOTYPE · Illustrative allocations and client records</span><span>Models workflow · <span id="storage">Checking local saving…</span></span></div>
<main id="app"></main><div id="footer"></div><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const $=id=>document.getElementById(id),copy=x=>JSON.parse(JSON.stringify(x)),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=x=>Number(x).toFixed(1).replace(/\.0$/,''),KEY='portfolio-model-design-v1';
const colours=['#246c53','#87a796','#d3b574','#8a97b4','#aa8674'];
const templates={Equity:[['Large-cap equity',.6],['Mid-cap equity',.24],['Small-cap equity',.16]],Debt:[['Government bonds',.5],['Corporate bonds',.25],['Fixed deposits',.25]],Gold:[['Gold ETF',.7],['Investment gold',.3]],Alternatives:[['Alternative funds',1]]};
function node(name,target,band=5){return{id:crypto.randomUUID(),name,target,band,children:[]}}
function seed(){return [['Conservative','Capital preservation with limited growth exposure',[25,65,10],12],['Moderate','Balance between growth and stability',[50,40,10],24],['Aggressive','Greater growth exposure over a longer horizon',[70,25,5],8]].map(([name,description,a,count],i)=>{const data={name,description,allocations:['Equity','Debt','Gold'].map((n,j)=>node(n,a[j],j===2?3:5))};if(i===1)data.allocations[0].children=templates.Equity.map(([n,w])=>node(n,a[0]*w,3));return{id:'model-'+i,versions:[{number:1,date:'04 Oct 2026',reason:'Initial sample model',data:copy(data)}],draft:null,clients:Array.from({length:count},(_,j)=>({name:['Ananya Shah','Rohan Mehta','Priya Nair','Arjun Iyer'][j%4]+' · '+String(j+1).padStart(2,'0'),version:1}))}})}
let models;try{models=JSON.parse(localStorage.getItem(KEY))||seed();$('storage').textContent='Saved in this browser'}catch{models=seed();$('storage').textContent='Session only: browser storage unavailable'}
let selected=null,editing=false,expanded=new Set(),dirty=false,toastTimer;
const current=()=>models.find(m=>m.id===selected),latest=m=>m.versions.at(-1),data=()=>editing?current().draft:latest(current()).data;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(models));$('storage').textContent='Saved in this browser'}catch{$('storage').textContent='Session only: browser storage unavailable'}}
function notify(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4000)}
function findNode(id,arr=data().allocations){for(const n of arr){if(n.id===id)return n;const c=findNode(id,n.children);if(c)return c}}
function validation(d){const e=[],sum=d.allocations.reduce((s,n)=>s+n.target,0);if(!d.name.trim())e.push('Give this model a name.');if(Math.abs(sum-100)>.01)e.push('Targets total '+fmt(sum)+'%. '+(sum>100?'Reduce':'Add')+' '+fmt(Math.abs(100-sum))+' percentage points.');function walk(ns){ns.forEach(n=>{if(!Number.isFinite(n.target)||n.target<0||n.target>100)e.push(n.name+': target must be between 0% and 100%.');if(!Number.isFinite(n.band)||n.band<0||n.band>100)e.push(n.name+': band must be between 0 and 100 pp.');if(n.children.length){const t=n.children.reduce((s,x)=>s+x.target,0);if(Math.abs(t-n.target)>.011)e.push(n.name+': breakdown totals '+fmt(t)+'%, but parent is '+fmt(n.target)+'%.');walk(n.children)}})}walk(d.allocations);return e}
function list(){selected=null;editing=false;$('footer').innerHTML='';$('app').innerHTML=`<div class="flex between"><div><div class="eyebrow">Investment strategy</div><h1>Models</h1><p class="muted">A consistent starting point. A considered plan for every client.</p></div><button class="primary" onclick="newModel()">＋ Create model</button></div><div class="card hero"><div><h2>Define once. Tailor for each individual.</h2><p class="muted">Publish reusable allocations, then review their suitability in each client’s target plan.</p><div class="chips"><span class="badge">Versioned strategies</span><span class="badge">Client approval preserved</span></div></div><div class="stat"><small>Published models</small><b>${models.filter(m=>m.versions.length).length}</b><small>${models.reduce((s,m)=>s+m.clients.length,0)} illustrative individual clients</small></div></div><div class="flex between toolbar"><h2>Your model library</h2><small>Open a model to view allocations and history</small></div><div class="card tablewrap" style="padding:0"><table><thead><tr><th>Model / intended use</th><th>Published version</th><th>Clients</th><th>Status</th><th></th></tr></thead><tbody>${models.map(m=>`<tr><td class="name"><button class="link" onclick="openModel('${m.id}')">${esc(latest(m)?.data.name||m.draft.name||'Untitled model')}</button><small>${esc(latest(m)?.data.description||m.draft.description)}</small></td><td>${latest(m)?'v'+latest(m).number:'—'}</td><td>${m.clients.length}</td><td><span class="badge ${m.draft?'draft':''}">${m.draft?'Draft changes':'Published'}</span></td><td><button onclick="openModel('${m.id}')">Open →</button></td></tr>`).join('')}</tbody></table></div><p class="muted"><small>Model updates never replace an individual’s approved target automatically. This prototype focuses on model authoring; client target review is the next workflow.</small></p>`}
function openModel(id){selected=id;editing=!latest(current());expanded=new Set();render()}
function startEdit(){const m=current();m.draft=m.draft||copy(latest(m).data);editing=true;dirty=false;render()}
function render(){const m=current(),d=data(),v=latest(m),issues=validation(d),total=d.allocations.reduce((s,n)=>s+n.target,0);$('app').innerHTML=`<div class="crumb"><button class="quiet" onclick="saveAndList()">← All models</button> / ${esc(d.name||'Untitled model')}</div><div class="flex between"><div><div class="eyebrow">Reusable investment strategy</div><h1>${esc(d.name||'Untitled model')} <span class="badge ${editing?'draft':''}">${editing?'Draft':'Published · v'+v.number}</span></h1><p class="muted">${esc(d.description||'Add an intended-use description.')}</p></div><div class="flex"><button onclick="history()">Version history</button>${!editing?`<button class="primary" onclick="startEdit()">${m.draft?'Resume draft':'Edit model'}</button>`:''}</div></div><div class="flex between toolbar"><small>${editing?'Working towards version '+(v?v.number+1:1):'Published '+v.date+' · Read-only version'}</small><button class="quiet" onclick="clients()">${m.clients.length} clients using this model →</button></div>${editing?`<details class="card"><summary>Model name & intended use</summary><label class="field">Model name<input id="modelName" value="${esc(d.name)}" onchange="data().name=this.value;dirty=true;render()"></label><label class="field">Intended use<textarea onchange="data().description=this.value;dirty=true;render()">${esc(d.description)}</textarea></label></details>`:''}<div class="panelgrid"><section><div class="card"><div class="flex between"><div><h2>Target allocation</h2><small>All targets are percentages of the whole portfolio.</small></div><strong class="${issues.length?'errors':'ok'}">${fmt(total)}% allocated</strong></div><div class="allocation">${d.allocations.map((n,i)=>`<span style="width:${Math.max(0,n.target)}%;background:${colours[i%5]}"></span>`).join('')}</div><div class="legend">${d.allocations.map((n,i)=>`<span><i class="dot" style="background:${colours[i%5]}"></i>${esc(n.name)} ${fmt(n.target)}%</span>`).join('')}</div></div><div class="card tablewrap" style="padding:0"><table class="allocationtable"><thead><tr><th>Allocation</th><th>Target %</th><th title="Percentage points above or below target before review is required">Allowed drift ± pp</th><th></th></tr></thead><tbody>${rows(d.allocations)}</tbody></table></div>${editing?'<button onclick="addAllocation()">＋ Add asset class</button>':''}<div class="card ${issues.length?'warning':''}"><h2>${issues.length?'Complete before publishing':'Allocation checks passed'}</h2>${issues.length?'<ul class="errors">'+issues.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>':'<p class="muted">Targets total 100%. Any specified breakdowns match their parent allocation.</p>'}<small>${editing?'Incomplete work can be saved as a draft.':'Published targets are stable until you create and publish a new version.'}</small></div></section><aside><div class="card"><div class="eyebrow">Reading this model</div><h2 style="margin-top:12px">Targets, not holdings</h2><p class="muted">This strategy defines intended percentages. Client balances appear in the comparison workflow.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>What is ±5 pp?</h2><p class="muted">A 50% target with a ±5 percentage-point band allows 45–55% before a review flag.</p><h2>Optional detail</h2><p class="muted">Expand a category to see its breakdown. A model can also stay at asset-class level.</p></div><div class="note">Publishing a new version leaves existing client targets unchanged until the adviser reviews and accepts it.</div></aside></div>`;$('footer').innerHTML=editing?`<div class="footer"><div><strong>${issues.length?issues.length+' validation issue'+(issues.length===1?'':'s'):'Ready for review'}</strong><small>${dirty?'Changes not saved yet':'Draft workspace'} · Client targets remain unchanged</small></div><div class="flex"><button onclick="saveDraft()">Save draft</button><button class="primary" onclick="review()" ${issues.length?'disabled':''}>Review & publish →</button></div></div>`:''}
function rows(ns,depth=0){return ns.map(n=>`<tr class="${depth?'child':'rowtop'}"><td><div style="padding-left:${depth*20}px"><button class="chev" aria-label="${expanded.has(n.id)?'Collapse':'Expand'} ${esc(n.name)}" aria-expanded="${expanded.has(n.id)}" onclick="toggle('${n.id}')">${expanded.has(n.id)?'⌄':'›'}</button><strong>${esc(n.name)}</strong><small style="display:block;margin-left:34px">${n.children.length?n.children.length+' allocation categories':'Target at this level'}</small></div></td><td><input aria-label="${esc(n.name)} target" class="target" type="number" step="0.1" min="0" max="100" value="${n.target}" ${editing?'':'disabled'} onchange="changeTarget('${n.id}',this.value)"></td><td><input aria-label="${esc(n.name)} band" class="target" type="number" step="0.5" min="0" max="100" value="${n.band}" ${editing?'':'disabled'} onchange="findNode('${n.id}').band=Number(this.value);dirty=true;render()"></td><td>${editing&&depth===0?`<button class="quiet" aria-label="Remove ${esc(n.name)}" onclick="removeNode('${n.id}')">×</button>`:''}</td></tr>${expanded.has(n.id)?(n.children.length?rows(n.children,depth+1)+(editing?`<tr><td colspan="4"><button class="quiet" onclick="clearBreakdown('${n.id}')">Keep ${esc(n.name)} target at this level only</button></td></tr>`:''):`<tr><td colspan="4"><div class="note">${editing&&templates[n.name]?`<span>No breakdown specified. </span><button onclick="breakdown('${n.id}')">Specify allocation breakdown</button>`:'This allocation is intentionally defined at this level. Detailed security selection is outside this prototype.'}</div></td></tr>`):''}`).join('')}
function toggle(id){expanded.has(id)?expanded.delete(id):expanded.add(id);render()}
function saveDraft(){persist();dirty=false;render();notify('Draft saved. Client targets are unchanged.')}
function saveAndList(){if(editing)persist();dirty=false;list()}
function show(content){$('modal').innerHTML=content;$('modal').showModal()}
const close=()=> $('modal').close();
function rescale(ns,total){let old=ns.reduce((s,n)=>s+n.target,0),used=0;ns.forEach((n,i)=>{n.target=i===ns.length-1?Math.round((total-used)*100)/100:Math.round((old?n.target/old:1/ns.length)*total*100)/100;used+=n.target;if(n.children.length)rescale(n.children,n.target)})}
function changeTarget(id,value){const n=findNode(id),v=Number(value);if(!Number.isFinite(v)||v<0||v>100){notify('Enter a target between 0 and 100%.');render();return}if(n.children.length&&n.target!==v){const preview=copy(n.children);rescale(preview,v);show(`<div class="eyebrow">Allocation change</div><h2>${esc(n.name)}: ${fmt(n.target)}% → ${fmt(v)}%</h2><p>Choose how to update the breakdown. Other asset-class targets will stay unchanged.</p><div class="tablewrap"><table><thead><tr><th>Category</th><th>Current</th><th>Proportional preview</th></tr></thead><tbody>${preview.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${fmt(n.children[i].target)}%</td><td>${fmt(x.target)}%</td></tr>`).join('')}</tbody></table></div><div class="actions"><button onclick="close();render()">Cancel</button><button onclick="applyTarget('${id}',${v},false)">Adjust manually</button><button class="primary" onclick="applyTarget('${id}',${v},true)">Distribute proportionally</button></div>`)}else{n.target=v;dirty=true;render()}}
function applyTarget(id,v,scale){const n=findNode(id);n.target=v;if(scale)rescale(n.children,v);expanded.add(id);dirty=true;close();render()}
function breakdown(id){const n=findNode(id);n.children=templates[n.name].map(([name,w])=>node(name,0,3));templates[n.name].forEach(([,w],i)=>n.children[i].target=w*n.target);rescale(n.children,n.target);dirty=true;render()}
function clearBreakdown(id){show(`<h2>Remove this breakdown?</h2><p>The ${esc(findNode(id).name)} target stays in place. Its detailed category targets will be removed from this draft.</p><div class="actions"><button onclick="close()">Cancel</button><button class="primary" onclick="findNode('${id}').children=[];dirty=true;close();render()">Keep parent target only</button></div>`)}
function removeNode(id){show(`<h2>Remove ${esc(findNode(id).name)}?</h2><p>You will need to bring the remaining targets back to 100% before publishing.</p><div class="actions"><button onclick="close()">Cancel</button><button class="primary" onclick="data().allocations=data().allocations.filter(n=>n.id!=='${id}');dirty=true;close();render()">Remove from draft</button></div>`)}
function addAllocation(){const options=Object.keys(templates).filter(x=>!data().allocations.some(n=>n.name===x));show(`<h2>Add asset class</h2>${options.length?`<label class="field">Category<select id="category">${options.map(x=>'<option>'+x+'</option>').join('')}</select></label><p class="muted">Starts at 0%. Set the target and adjust other allocations to total 100%.</p><div class="actions"><button onclick="close()">Cancel</button><button class="primary" onclick="data().allocations.push(node($('category').value,0));dirty=true;close();render()">Add allocation</button></div>`:'<p>All sample asset classes are already present.</p><button onclick="close()">Close</button>'}`)}
function newModel(){show(`<h2>Create a model</h2><p class="muted">Start with an empty allocation plan. You can save incomplete work.</p><label class="field">Model name<input id="newName" placeholder="e.g. Balanced growth" maxlength="80"></label><label class="field">Intended use<textarea id="newDesc" placeholder="Who is this strategy intended for?"></textarea></label><p id="newError" class="errors"></p><div class="actions"><button onclick="close()">Cancel</button><button class="primary" onclick="createModel()">Create draft</button></div>`)}
function createModel(){const name=$('newName').value.trim();if(!name){$('newError').textContent='Enter a model name.';return}const m={id:crypto.randomUUID(),versions:[],clients:[],draft:{name,description:$('newDesc').value.trim(),allocations:[]}};models.push(m);persist();close();openModel(m.id)}
function flatten(d){const out={};function walk(ns,path=''){ns.forEach(n=>{let k=path+n.name;out[k]={target:n.target,band:n.band};walk(n.children,k+' / ')})}walk(d?.allocations||[]);return out}
function changes(before,after){const a=flatten(before),b=flatten(after),keys=[...new Set([...Object.keys(a),...Object.keys(b)])];let r=keys.filter(k=>JSON.stringify(a[k])!==JSON.stringify(b[k])).map(k=>`<tr><td>${esc(k)}</td><td>${a[k]?fmt(a[k].target)+'% · ±'+fmt(a[k].band)+' pp':'—'}</td><td>${b[k]?fmt(b[k].target)+'% · ±'+fmt(b[k].band)+' pp':'Removed'}</td></tr>`).join('');for(const field of ['name','description'])if(before?.[field]!==after[field])r+=`<tr><td>${field==='name'?'Model name':'Intended use'}</td><td>${esc(before?.[field]||'—')}</td><td>${esc(after[field])}</td></tr>`;return r||'<tr><td colspan="3">No changes from the published version.</td></tr>'}
function review(){if(validation(data()).length)return;show(`<div class="eyebrow">Review new version</div><h2>Publish ${esc(data().name)} · v${(latest(current())?.number||0)+1}</h2><div class="tablewrap"><table><thead><tr><th>Allocation / field</th><th>Published</th><th>Draft</th></tr></thead><tbody>${changes(latest(current())?.data,data())}</tbody></table></div><div class="note" style="margin-top:18px"><b>${current().clients.length} clients retain their existing target.</b><br>This version becomes available for an adviser to review; it is not applied automatically.</div><label class="field">Reason for this version <small>Required for the version history</small><textarea id="reason" placeholder="Explain why the strategy is changing."></textarea></label><p id="publishError" class="errors"></p><div class="actions"><button onclick="close()">Back to draft</button><button class="primary" onclick="publish()">Publish model version</button></div>`)}
function publish(){const reason=$('reason').value.trim();if(!reason){$('publishError').textContent='Add a reason before publishing.';return}const m=current();if(validation(m.draft).length)return;m.versions.push({number:(latest(m)?.number||0)+1,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),reason,data:copy(m.draft)});m.draft=null;editing=false;dirty=false;persist();close();render();notify('New version published. Existing client targets are unchanged.')}
function history(){const m=current();show(`<h2>Version history</h2><p class="muted">${esc(data().name)} · Published snapshots are preserved.</p>${m.versions.length?[...m.versions].reverse().map(v=>`<div class="history"><strong>Version ${v.number}</strong> <small>· ${v.date}</small><p>${esc(v.reason)}</p><div class="chips">${v.data.allocations.map(n=>`<span class="badge">${esc(n.name)} ${fmt(n.target)}%</span>`).join('')}</div><button class="quiet" onclick="snapshot(${v.number})">View full snapshot →</button></div>`).join(''):'<p>No published versions yet.</p>'}<div class="actions"><button onclick="close()">Close</button></div>`)}
function snapshot(number){const v=current().versions.find(v=>v.number===number);$('modal').innerHTML=`<h2>${esc(v.data.name)} · v${v.number}</h2><p>${esc(v.data.description)}</p><div class="tablewrap"><table><thead><tr><th>Allocation</th><th>Target</th><th>Band</th></tr></thead><tbody>${Object.entries(flatten(v.data)).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${fmt(n.target)}%</td><td>±${fmt(n.band)} pp</td></tr>`).join('')}</tbody></table></div><div class="actions"><button onclick="close();history()">Back to history</button><button onclick="close()">Close</button></div>`}
function clients(){const m=current(),v=latest(m)?.number;show(`<h2>Clients using this model</h2><p class="muted">Illustrative individual records. Their approved model versions stay fixed.</p><div class="tablewrap"><table><thead><tr><th>Individual client</th><th>Approved model</th><th>Status</th></tr></thead><tbody>${m.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>v${c.version}</td><td><span class="badge ${c.version<v?'draft':''}">${c.version<v?'New version available':'Current version'}</span></td></tr>`).join('')||'<tr><td colspan="3">No clients assigned yet.</td></tr>'}</tbody></table></div><p class="note">Review and acceptance will be part of the Client target screen, which is outside this models prototype.</p><div class="actions"><button onclick="close()">Close</button></div>`)}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});list();
</script></body></html>
